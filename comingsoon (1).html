<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewind21 — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --ink: #f9fbff; --muted: #bbcae5; --panel: rgba(15, 26, 54, .74); }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: var(--ink); font-family: "Lexend", Arial, sans-serif; background: #071126; }
      .glow { position: fixed; width: 38rem; aspect-ratio: 1; border-radius: 50%; filter: blur(18px); opacity: .45; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
      .glow-one { top: -16rem; left: -13rem; background: #235dcf; }
      .glow-two { right: -16rem; bottom: -18rem; background: #723bd0; animation-delay: -5s; }
      main { position: relative; width: min(92%, 720px); padding: 3.2rem clamp(1.5rem, 7vw, 5.5rem); text-align: center; background: var(--panel); border: 1px solid rgba(177, 208, 255, .22); border-radius: 28px; box-shadow: 0 26px 80px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .06); backdrop-filter: blur(16px); animation: arrive 800ms cubic-bezier(.2,.8,.2,1) both; }
      .badge { display: inline-flex; align-items: center; gap: .55rem; margin: 0 0 1.5rem; padding: .55rem .85rem; color: #dceaff; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(79, 165, 255, .13); border: 1px solid rgba(113, 182, 255, .3); border-radius: 999px; }
      .status-dot { width: .5rem; height: .5rem; border-radius: 50%; background: #76e8a7; box-shadow: 0 0 0 0 rgba(118, 232, 167, .65); animation: pulse 1.8s infinite; }
      h1 { max-width: 11ch; margin: 0 auto; font-size: clamp(2.4rem, 7vw, 4.7rem); line-height: 1.02; letter-spacing: -.075em; }
      h1 span { display: block; background: linear-gradient(105deg, #8bc8ff, #b9aaff 55%, #f2d3ff); background-clip: text; -webkit-background-clip: text; color: transparent; }
      p { max-width: 46ch; margin: 1.5rem auto 0; color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.16rem); line-height: 1.7; }
      .divider { width: 100%; height: 1px; margin: 2.2rem 0 1.35rem; background: linear-gradient(90deg, transparent, rgba(166, 201, 255, .36), transparent); }
      .signature { margin: 0; color: #e5edff; font-size: .9rem; font-weight: 600; }
      @keyframes arrive { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes drift { from { transform: translate3d(-3rem, -1rem, 0) scale(.95); } to { transform: translate3d(4rem, 3rem, 0) scale(1.1); } }
      @keyframes pulse { 70% { box-shadow: 0 0 0 .45rem rgba(118, 232, 167, 0); } 100% { box-shadow: 0 0 0 0 rgba(118, 232, 167, 0); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <main>
      <h1>Welcome to <span>Rewind21.</span></h1>
      <p>Step back into the BEST Roblox era. We’re still developing the platform—check back soon.</p>
      <div class="divider"></div>
      <p class="signature">— The Rewind21 Development Team</p>
    </main>
  </body>
</html>
